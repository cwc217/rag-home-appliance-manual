name: Deploy Dev via Docker Compose

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on:
      - self-hosted
      - dev
    environment: dev
    timeout-minutes: 30
    env:
      DEPLOY_ENV_FILE: ${{ github.workspace }}\deployment.env

    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Create deployment environment file
        shell: pwsh
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'manuals' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AzureOpenAI__Endpoint }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AzureOpenAI__ApiKey }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AzureOpenAI__ChatDeployment }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AzureOpenAI__EmbeddingDeployment }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AzureOpenAI__ApiVersion }}
          AZURE_OPENAI_EMBEDDING_DIMENSIONS: ${{ vars.AzureOpenAI__EmbeddingDimensions || '1536' }}
          SEED_ADMIN_EMAIL: ${{ secrets.SeedAdmin__Email }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SeedAdmin__Password }}
        run: |
          $required = @(
            "POSTGRES_PASSWORD",
            "POSTGRES_DB",
            "POSTGRES_USER",
            "AZURE_OPENAI_ENDPOINT",
            "AZURE_OPENAI_API_KEY",
            "AZURE_OPENAI_CHAT_DEPLOYMENT",
            "AZURE_OPENAI_EMBEDDING_DEPLOYMENT",
            "AZURE_OPENAI_API_VERSION",
            "AZURE_OPENAI_EMBEDDING_DIMENSIONS",
            "SEED_ADMIN_EMAIL",
            "SEED_ADMIN_PASSWORD"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Required deployment setting is missing for $name."
            }
          }
          @"
          POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD
          POSTGRES_DB=$env:POSTGRES_DB
          POSTGRES_USER=$env:POSTGRES_USER
          AzureOpenAI__Endpoint=$env:AZURE_OPENAI_ENDPOINT
          AzureOpenAI__ApiKey=$env:AZURE_OPENAI_API_KEY
          AzureOpenAI__ChatDeployment=$env:AZURE_OPENAI_CHAT_DEPLOYMENT
          AzureOpenAI__EmbeddingDeployment=$env:AZURE_OPENAI_EMBEDDING_DEPLOYMENT
          AzureOpenAI__ApiVersion=$env:AZURE_OPENAI_API_VERSION
          AzureOpenAI__EmbeddingDimensions=$env:AZURE_OPENAI_EMBEDDING_DIMENSIONS
          SeedAdmin__Email=$env:SEED_ADMIN_EMAIL
          SeedAdmin__Password=$env:SEED_ADMIN_PASSWORD
          "@ | Set-Content -LiteralPath $env:DEPLOY_ENV_FILE -Encoding utf8NoBOM

      - name: Verify deployment environment file
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:DEPLOY_ENV_FILE -PathType Leaf)) {
            throw "Deployment environment file was not found: $env:DEPLOY_ENV_FILE"
          }

      - name: Deploy with Docker Compose
        shell: pwsh
        run: docker compose --env-file "$env:DEPLOY_ENV_FILE" up -d --build --remove-orphans

      - name: Show service status
        shell: pwsh
        run: docker compose --env-file "$env:DEPLOY_ENV_FILE" ps
