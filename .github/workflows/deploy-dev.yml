name: Deploy Dev via Docker Compose

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Verify Docker
        run: |
          docker version
          docker compose version

      - name: Deploy with Docker Compose
        run: docker compose up -d --build --remove-orphans

      - name: Show service status
        run: docker compose ps
